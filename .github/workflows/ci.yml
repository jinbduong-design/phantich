name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Package AI Studio source
        run: |
          zip -r ProductPulse-v0.4.0-AI-Studio.zip .             -x ".git/*"             -x "node_modules/*"             -x "dist/*"

      - name: Upload AI Studio source
        uses: actions/upload-artifact@v4
        with:
          name: ProductPulse-v0.4.0-AI-Studio
          path: ProductPulse-v0.4.0-AI-Studio.zip
          if-no-files-found: error
